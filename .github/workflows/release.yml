name: Release

# Tag `vX.Y.Z` (a versão do build vem da tag) → compila Linux, Windows e macOS
# e publica uma release no GitHub com os pacotes e o SHA256SUMS.txt.
# Rodar manualmente (workflow_dispatch) só gera os pacotes como artefatos.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            # 22.04 = glibc 2.35: o binário roda em distros mais antigas também
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - platform: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev

      - name: Definir versão
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tag é a fonte da versão: grava ela no Cargo.toml/Cargo.lock só
            # para este build, assim não é preciso editar o Cargo.toml antes.
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME não é uma versão válida (use vX.Y.Z)"
              exit 1
            fi
            perl -0pi -e 's/^version = ".*?"/version = "'"$version"'"/m' Cargo.toml
            perl -0pi -e 's/(name = "rustdraw"\r?\nversion = )".*?"/$1"'"$version"'"/' Cargo.lock
            git diff --stat
          else
            crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            version="$crate_version-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg=rustdraw-$version-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Testes
        run: cargo test --locked

      - name: Compilar
        shell: bash
        run: |
          IFS=',' read -ra targets <<< "${{ matrix.targets }}"
          for t in "${targets[@]}"; do
            cargo build --release --locked --target "$t"
          done

      - name: Licenças de terceiros
        shell: bash
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.2
          cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Empacotar
        shell: bash
        env:
          PKG: ${{ steps.version.outputs.pkg }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "dist/$PKG"
          case "${{ matrix.platform }}" in
            macos-universal)
              # Um executável solto aberto pelo Finder roda dentro do Terminal;
              # dentro de um bundle .app ele abre só a janela do editor.
              app="dist/$PKG/RustDraw.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              lipo -create -output "$app/Contents/MacOS/rustdraw" \
                target/aarch64-apple-darwin/release/rustdraw \
                target/x86_64-apple-darwin/release/rustdraw
              lipo -info "$app/Contents/MacOS/rustdraw"
              # CFBundleShortVersionString só aceita X.Y.Z (sem -dev.abc1234)
              bundle_version="${VERSION%%-*}"
              sed "s/@VERSION@/$bundle_version/g" packaging/macos/Info.plist \
                > "$app/Contents/Info.plist"
              plutil -lint "$app/Contents/Info.plist"
              printf 'APPL????' > "$app/Contents/PkgInfo"
              # Ícone do Dock e do Finder: o próprio binário desenha o ícone em
              # cada tamanho (com a margem dos ícones do macOS) e o iconutil
              # monta o .icns
              iconset="$RUNNER_TEMP/RustDraw.iconset"
              mkdir -p "$iconset"
              for s in 16 32 128 256 512; do
                "$app/Contents/MacOS/rustdraw" icon "$iconset/icon_${s}x${s}.png" --size "$s" --margin 0.1
                "$app/Contents/MacOS/rustdraw" icon "$iconset/icon_${s}x${s}@2x.png" --size "$((s * 2))" --margin 0.1
              done
              iconutil -c icns "$iconset" -o "$app/Contents/Resources/RustDraw.icns"
              # Assinatura ad-hoc do bundle inteiro (o Apple Silicon exige
              # alguma assinatura e o Info.plist precisa estar selado nela)
              codesign --force --sign - "$app"
              codesign --verify --strict --verbose=2 "$app"
              ;;
            windows-*)
              cp "target/${{ matrix.targets }}/release/rustdraw.exe" "dist/$PKG/"
              ;;
            *)
              cp "target/${{ matrix.targets }}/release/rustdraw" "dist/$PKG/"
              ;;
          esac
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md \
            THIRD_PARTY_LICENSES.html assets/fonts/Virgil-LICENSE.md "dist/$PKG/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          else
            tar -czf "$PKG.tar.gz" "$PKG"
          fi
          rm -rf "$PKG"
          ls -l

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.pkg }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
