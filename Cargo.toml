[package]
name = "rustdraw"
version = "0.1.2"
edition = "2024"
description = "Editor de diagramas no estilo Excalidraw, nativo em Rust e 100% offline"
repository = "https://github.com/diegofernandes/rustdraw"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
epaint_default_fonts = "0.37.0"
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
pollster = "0.4.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
wuff = "0.2.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
